<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Show — Saturday Night Science</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #f0f5fb;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body.idle { cursor: none; }

    .layer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
      opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s; }
    .layer.on { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; z-index: 2; }
    video.layer { object-fit: contain; }

    /* Avvio: serve un clic per lo schermo intero e per l'audio dei video */
    #start { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; cursor: pointer;
      background: radial-gradient(60% 50% at 50% 50%, rgba(65,183,255,0.10), transparent 70%), rgba(2,4,11,0.92);
      transition: opacity .5s ease; }
    #start.gone { opacity: 0; pointer-events: none; }
    #start .btn { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(65,183,255,0.6);
      background: rgba(65,183,255,0.16); box-shadow: 0 0 50px rgba(65,183,255,0.25);
      display: flex; align-items: center; justify-content: center; }
    #start .btn::before { content: ''; border-left: 38px solid rgba(255,255,255,0.95);
      border-top: 24px solid transparent; border-bottom: 24px solid transparent; margin-left: 10px; }
    #start p { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #8fd2ff; }
    #start small { font-size: 13px; color: rgba(240,245,251,0.5); }

    /* Audio bloccato dal browser: il video parte muto, un clic lo riattiva */
    #sound { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 45;
      padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(65,183,255,0.5);
      background: rgba(2,4,11,0.85); color: #dff2ff; font-size: 15px; cursor: pointer;
      display: none; }
    #sound.show { display: block; }

    /* Avvio del video bloccato del tutto (Safari, risparmio energetico): serve un tocco */
    #tap { position: fixed; inset: 0; z-index: 48; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; cursor: pointer; background: rgba(2,4,11,0.55); }
    #tap.show { display: flex; }
    #tap .btn { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(65,183,255,0.7);
      background: rgba(65,183,255,0.2); display: flex; align-items: center; justify-content: center; }
    #tap .btn::before { content: ''; border-left: 38px solid #fff; border-top: 24px solid transparent;
      border-bottom: 24px solid transparent; margin-left: 10px; }
    #tap p { font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: #dff2ff; }

    /* Pallino discreto: collegamento con la console */
    #link { position: fixed; top: 10px; right: 10px; z-index: 40; width: 8px; height: 8px; border-radius: 50%;
      background: #34d399; opacity: 0; transition: opacity .4s; pointer-events: none; }
    body:not(.idle) #link.show { opacity: .7; }
  </style>
</head>
<body>
  <iframe class="layer" id="frame-a" title="Slide"></iframe>
  <iframe class="layer" id="frame-b" title="Slide"></iframe>
  <video class="layer" id="vid" playsinline preload="auto"></video>

  <div id="start" role="button" tabindex="0">
    <div class="btn"></div>
    <p>Avvia a tutto schermo</p>
    <small>Frecce / telecomando per le slide · F schermo intero · la console comanda da un'altra finestra</small>
  </div>
  <div id="link" title="Console collegata"></div>
  <div id="sound" role="button">Audio disattivato dal browser — tocca lo schermo per attivarlo</div>
  <div id="tap" role="button"><div class="btn"></div><p>Tocca per avviare il video</p></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="js/sns-config.js"></script>
  <script src="js/sns.js"></script>
  <script>
    const frames = [document.getElementById('frame-a'), document.getElementById('frame-b')];
    const vid = document.getElementById('vid');
    let front = 0;                 // iframe visibile
    let current = null;            // id dell'elemento in onda
    let slideIdx = 0;              // posizione nella scaletta dell'ultima slide mostrata

    // Ordine delle slide: lo decide la console (trascinando le schede) e lo
    // show lo ricorda in questo browser.
    const ORDER_KEY = 'sns-show-order';
    let order = SNS.SLIDES.slice();
    function setOrder(ids) {
      if (!Array.isArray(ids)) return false;
      const byId = new Map(SNS.SLIDES.map(x => [x.id, x]));
      const next = ids.filter(id => byId.has(id)).map(id => byId.get(id));
      SNS.SLIDES.forEach(x => { if (!next.includes(x)) next.push(x); });   // slide nuove in coda
      const changed = next.some((x, i) => x !== order[i]);
      order = next;
      const cur = order.findIndex(x => x.id === current);
      if (cur >= 0) slideIdx = cur;
      try { localStorage.setItem(ORDER_KEY, JSON.stringify(order.map(x => x.id))); } catch (_) {}
      return changed;
    }
    try { setOrder(JSON.parse(localStorage.getItem(ORDER_KEY))); } catch (_) {}
    let videoURL = null;
    let lang = localStorage.getItem('geopolitica-lang') || 'it';
    let loadToken = 0;

    function state() {
      return { t: 'state', id: current, lang,
        playing: current && current.startsWith('video:') ? !vid.paused && !vid.ended : false,
        time: vid.currentTime || 0, dur: isFinite(vid.duration) ? vid.duration : 0,
        fs: !!document.fullscreenElement, order: order.map(x => x.id), blocked: tap.classList.contains('show'), muted: vid.muted, at: Date.now() };
    }
    function report(local) { SNS.send(state(), local); }

    function stopVideo() {
      vid.pause();
      vid.classList.remove('on');
      sound.classList.remove('show');
      tap.classList.remove('show');
    }

    function showSlide(i) {
      if (i < 0 || i >= order.length) return;
      const s = order[i];
      slideIdx = i;
      if (current === s.id) return;
      current = s.id;
      const token = ++loadToken;
      const back = frames[1 - front];
      back.onload = () => {
        if (token !== loadToken) return;
        try { back.contentWindow.postMessage({ type: 'op-setlang', lang }, '*'); } catch (_) {}
        setTimeout(() => {
          if (token !== loadToken) return;
          back.classList.add('on');
          frames[front].classList.remove('on');
          stopVideo();
          front = 1 - front;
          // libera la slide precedente quando la dissolvenza è finita
          const old = frames[1 - front];
          setTimeout(() => { if (token === loadToken && !old.classList.contains('on')) old.removeAttribute('src'); }, 800);
        }, 80);
      };
      back.src = s.src;
      report();
    }

    function showVideo(id) {
      const hosted = SNS.VIDEOS.find(v => v.id === id);
      (hosted ? Promise.resolve(hosted) : SNS.videos.get(id)).then(v => {
        if (!v) return;
        ++loadToken;
        current = id;
        if (videoURL) { URL.revokeObjectURL(videoURL); videoURL = null; }
        if (v.blob) videoURL = URL.createObjectURL(v.blob);
        vid.src = videoURL || v.src;
        vid.muted = false;
        vid.classList.add('on');
        frames.forEach(f => f.classList.remove('on'));
        playVideo();
        report();
      });
    }

    // Senza un tocco sullo show il browser può bloccare l'audio: in quel caso il
    // video parte muto con l'invito a riattivarlo. Safari può bloccare anche il
    // video muto: allora compare un grande pulsante da toccare.
    const sound = document.getElementById('sound');
    const tap = document.getElementById('tap');
    function playVideo() {
      tap.classList.remove('show');
      vid.play().then(() => { if (!vid.muted) sound.classList.remove('show'); }).catch(() => {
        vid.muted = true;
        vid.play().then(() => { sound.classList.add('show'); report(); }).catch(() => { tap.classList.add('show'); report(); });
      });
    }
    function unmute() {
      tap.classList.remove('show');
      if (vid.muted) { vid.muted = false; sound.classList.remove('show'); report(); }
      if (current && current.startsWith('video:') && vid.paused) playVideo();
    }
    tap.addEventListener('click', e => { e.stopPropagation(); unmute(); });

    // Al primo tocco sulla pagina «sblocca» l'elemento video, con l'audio: per
    // Safari un play() non muto nato da un gesto vale anche per i video lanciati
    // dopo dalla console. play() e pause() nello stesso istante: non si sente nulla.
    let unlocked = false;
    function unlockMedia() {
      if (unlocked) return;
      unlocked = true;
      if (current && current.startsWith('video:')) { unmute(); return; }
      if (!vid.getAttribute('src') && SNS.VIDEOS.length) vid.src = SNS.VIDEOS[0].src;
      vid.muted = false;
      const p = vid.play();
      vid.pause();
      if (p) p.catch(() => {});
    }
    ['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlockMedia, true));
    // Video partito muto: qualunque tocco sullo show riattiva l'audio
    document.addEventListener('pointerdown', () => {
      if (unlocked && vid.muted && current && current.startsWith('video:')) unmute();
    }, true);
    sound.addEventListener('click', e => { e.stopPropagation(); unmute(); });

    function go(id) {
      const i = order.findIndex(s => s.id === id);
      if (i >= 0) showSlide(i);
      else if (id && id.startsWith('video:')) showVideo(id);
    }
    function next() {
      if (current && current.startsWith('video:')) showSlide(Math.min(slideIdx + 1, order.length - 1));
      else showSlide(slideIdx + 1);
    }
    function prev() {
      if (current && current.startsWith('video:')) showSlide(slideIdx);
      else showSlide(slideIdx - 1);
    }

    function setLang(l) {
      if (l !== 'it' && l !== 'en') return;
      lang = l;
      try { localStorage.setItem('geopolitica-lang', l); } catch (_) {}
      frames.forEach(f => { try { f.contentWindow.postMessage({ type: 'op-setlang', lang: l }, '*'); } catch (_) {} });
      report();
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    // ── Avvio ──
    const start = document.getElementById('start');
    function begin() {
      if (start.classList.contains('gone')) return;
      start.classList.add('gone');
      document.documentElement.requestFullscreen().catch(() => {});
      unmute();
      if (current && current.startsWith('video:') && vid.paused) playVideo();
    }
    start.addEventListener('click', begin);

    // ── Tastiera / telecomando ──
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
      if (!start.classList.contains('gone') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); begin(); return; }
      if ((e.key === 'k' || e.key === 'K') && current && current.startsWith('video:')) {
        vid.paused ? playVideo() : vid.pause(); return;
      }
      if (SNS.isNext(e)) { e.preventDefault(); next(); }
      else if (SNS.isPrev(e)) { e.preventDefault(); prev(); }
    });
    // Le slide nell'iframe inoltrano qui i tasti (js/common.js, initEmbed)
    window.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'op-nav') d.dir === 'next' ? next() : prev();
    });

    // ── Comandi dalla console ──
    const link = document.getElementById('link');
    let linkTimer = null;
    SNS.listen(m => {
      link.classList.add('show');
      clearTimeout(linkTimer);
      linkTimer = setTimeout(() => link.classList.remove('show'), 6000);
      // Un comando della console toglie il riquadro d'avvio, che altrimenti
      // coprirebbe slide e video (lo schermo intero resta da attivare con F o un clic).
      if (m.t === 'go' || m.t === 'next' || m.t === 'prev' || m.t === 'video') start.classList.add('gone');
      switch (m.t) {
        case 'go': go(m.id); break;
        case 'next': next(); break;
        case 'prev': prev(); break;
        case 'lang': setLang(m.lang); break;
        case 'video':
          if (!current || !current.startsWith('video:')) break;
          if (m.op === 'play') playVideo();
          else if (m.op === 'pause') vid.pause();
          else if (m.op === 'restart') { vid.currentTime = 0; playVideo(); }
          else if (m.op === 'seek' && isFinite(m.time)) vid.currentTime = m.time;
          break;
        case 'order': if (setOrder(m.ids)) report(); break;
        case 'hello': report(!m.net); break;   // risponde sullo stesso canale del ping
      }
    });

    let lastTick = 0;
    vid.addEventListener('timeupdate', () => { const n = Date.now(); if (n - lastTick > 900) { lastTick = n; report(true); } });
    ['play', 'pause', 'ended', 'loadedmetadata', 'seeked'].forEach(ev => vid.addEventListener(ev, () => report()));
    document.addEventListener('fullscreenchange', () => report());

    // Cursore nascosto dopo 2 s di inattività
    let idleTimer = null;
    function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000); }
    document.addEventListener('mousemove', wake);
    wake();

    showSlide(0);
    SNS.send({ t: 'show-ready' });
  </script>
</body>
</html>
