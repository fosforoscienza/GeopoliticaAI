<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saturday Night Science — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --violet: #7c5cff; }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(80% 55% at 50% 110%, rgba(124,92,255,0.22), transparent 70%),
        radial-gradient(60% 50% at 50% -10%, rgba(65,183,255,0.14), transparent 70%),
        #02040b;
    }

    /* ---------- Cielo notturno: stelle che formano una rete neurale ---------- */
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* scuro al centro per far respirare il titolo */
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(46% 40% at 50% 48%, rgba(2,4,11,0.82) 0%, rgba(2,4,11,0.45) 55%, rgba(2,4,11,0) 100%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.75);
    }

    /* ---------- Titolo ---------- */
    .content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 clamp(16px, 4vw, 60px);
      padding-bottom: clamp(90px, 15vh, 170px);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 14px;
      font-size: clamp(12px, 1vw, 16px);
      font-weight: 700; letter-spacing: 0.36em;
      text-transform: uppercase; color: var(--accent-soft);
      margin-bottom: clamp(18px, 3vh, 34px);
      animation: rise 0.9s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; width: 34px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent));
    }
    .eyebrow::after { background: linear-gradient(90deg, var(--accent), transparent); }

    .title { margin: 0; line-height: 0.86; }
    .title .l1 {
      display: block;
      font-size: clamp(30px, 4.6vw, 84px);
      font-weight: 300; letter-spacing: 0.32em; margin-right: -0.32em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent) 0%, #b7a6ff 55%, var(--violet) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 22px rgba(65,183,255,0.45));
      animation: rise 1s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }
    .title .l2 {
      display: block;
      font-size: clamp(76px, 13.4vw, 250px);
      font-weight: 900; letter-spacing: -0.035em;
      text-transform: uppercase;
      margin-top: clamp(4px, 1vh, 14px);
      background: linear-gradient(180deg, #ffffff 30%, #c9dcff 78%, #9a8cff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 60px rgba(124,92,255,0.35));
      animation: rise 1.1s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .divider {
      position: relative; width: min(520px, 60vw); height: 1px;
      margin: clamp(20px, 3.4vh, 38px) auto clamp(16px, 2.6vh, 28px);
      background: linear-gradient(90deg, transparent, rgba(143,210,255,0.55), transparent);
      animation: grow 1.2s 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    .divider::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 8px; height: 8px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #fff; box-shadow: 0 0 14px 4px rgba(65,183,255,0.8);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes grow { from { opacity: 0; transform: scaleX(0.2); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .subtitle {
      font-size: clamp(22px, 2.6vw, 46px);
      font-weight: 300; font-style: italic;
      color: #e6ecf5; letter-spacing: 0.01em;
      margin: 0;
      animation: rise 1s 0.85s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ---------- Loghi partner ---------- */
    .partners {
      position: absolute; left: 0; right: 0; bottom: clamp(54px, 8vh, 90px);
      z-index: 3;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(26px, 3.6vw, 64px);
      animation: rise 1s 1.1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .partners img { display: block; width: auto; }
    .partners .fds  { height: clamp(56px, 8.2vh, 96px); }
    .partners .dima { height: clamp(34px, 5vh, 58px); }
    .partners .sep {
      width: 1px; height: clamp(48px, 7vh, 80px);
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.35), transparent);
    }

    @media (max-aspect-ratio: 1/1) {
      .title .l1 { letter-spacing: 0.18em; margin-right: -0.18em; font-size: 7vw; }
      .title .l2 { font-size: 17vw; }
      .partners { flex-direction: column; gap: 18px; }
      .partners .sep { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); }
    }
  </style>
</head>
<body>

  <div class="stage">
    <canvas id="sky"></canvas>
    <div class="scrim"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title">
        <span class="l1">Saturday Night</span>
        <span class="l2">Science</span>
      </h1>
      <div class="divider"></div>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <div class="partners">
      <img class="fds" src="img/loghi/festival-scienza-negativo.png" alt="Festival della Scienza" />
      <span class="sep"></span>
      <img class="dima" src="img/loghi/dima-negativo.png" alt="Università di Genova — DIMA Dipartimento di Matematica" />
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="index.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    const TXT = {
      it: { eyebrow: 'Festival della Scienza · Genova', subtitle: 'Macchine che pensano da sole' },
      en: { eyebrow: 'Festival della Scienza · Genoa',  subtitle: 'Machines that think for themselves' }
    };
    function renderTexts() {
      const t = TXT[lang];
      document.getElementById('eyebrow').textContent  = t.eyebrow;
      document.getElementById('subtitle').textContent = t.subtitle;
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();

    // ── Cielo-rete: stelle che si collegano e si scambiano impulsi ──
    (function sky() {
      const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W, H, dpr, stars = [], nodes = [], pulses = [], LINK;

      function init() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        LINK = Math.max(110, Math.min(W, H) * 0.2);
        const area = W * H;
        stars = Array.from({ length: Math.round(area / 2600) }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.1 + 0.2, a: Math.random() * 0.6 + 0.15,
          tw: Math.random() * Math.PI * 2
        }));
        nodes = Array.from({ length: Math.round(area / 19000) }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.16, vy: (Math.random() - 0.5) * 0.16,
          r: Math.random() * 1.4 + 1.1
        }));
        pulses = [];
      }

      function links() {
        const out = [];
        for (let i = 0; i < nodes.length; i++)
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
            const d = Math.hypot(dx, dy);
            if (d < LINK) out.push([i, j, d]);
          }
        return out;
      }

      let last = 0;
      function frame(t) {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          const a = s.a * (0.65 + 0.35 * Math.sin(t * 0.0012 + s.tw));
          ctx.fillStyle = `rgba(220,232,255,${a})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        for (const n of nodes) {
          n.x += n.vx; n.y += n.vy;
          if (n.x < -20) n.x = W + 20; if (n.x > W + 20) n.x = -20;
          if (n.y < -20) n.y = H + 20; if (n.y > H + 20) n.y = -20;
        }
        const L = links();
        ctx.lineWidth = 1;
        for (const [i, j, d] of L) {
          const a = (1 - d / LINK) * 0.32;
          ctx.strokeStyle = `rgba(110,170,255,${a})`;
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
        }
        for (const n of nodes) {
          ctx.fillStyle = 'rgba(190,215,255,0.9)';
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.fill();
        }
        // nuovi impulsi: un "pensiero" che corre lungo la rete
        if (t - last > 140 && L.length) {
          last = t;
          const [i, j] = L[(Math.random() * L.length) | 0];
          pulses.push({ a: i, b: j, p: 0, hue: Math.random() < 0.5 ? '65,183,255' : '160,130,255' });
        }
        pulses = pulses.filter(pl => pl.p <= 1);
        for (const pl of pulses) {
          pl.p += 0.012;
          const A = nodes[pl.a], B = nodes[pl.b];
          const x = A.x + (B.x - A.x) * pl.p, y = A.y + (B.y - A.y) * pl.p;
          const g = ctx.createRadialGradient(x, y, 0, x, y, 10);
          g.addColorStop(0, `rgba(${pl.hue},0.95)`); g.addColorStop(1, `rgba(${pl.hue},0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 10, 0, 6.283); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 6.283); ctx.fill();
        }
        if (!still) requestAnimationFrame(frame);
      }

      init();
      window.addEventListener('resize', init);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
