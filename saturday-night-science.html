<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saturday Night Science — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --accent-deep: #1f7fd1; }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(80% 55% at 50% 110%, rgba(31,127,209,0.20), transparent 70%),
        radial-gradient(60% 50% at 50% -10%, rgba(65,183,255,0.14), transparent 70%),
        #02040b;
    }

    /* ---------- Rete neurale a strati, attraversata da segnali ---------- */
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* scuro al centro per far respirare il titolo */
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(46% 40% at 50% 48%, rgba(2,4,11,0.82) 0%, rgba(2,4,11,0.45) 55%, rgba(2,4,11,0) 100%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.75);
    }

    /* ---------- Titolo ---------- */
    .content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 clamp(16px, 4vw, 60px);
      padding-bottom: clamp(90px, 15vh, 170px);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .title { margin: 0; line-height: 0.86; }
    .title .l1 {
      display: block;
      font-size: clamp(30px, 4.6vw, 84px);
      font-weight: 300; letter-spacing: 0.32em; margin-right: -0.32em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-soft) 0%, var(--accent) 50%, var(--accent-soft) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 22px rgba(65,183,255,0.45));
      animation: rise 1s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }
    .title .l2 {
      display: block;
      font-size: clamp(76px, 13.4vw, 250px);
      font-weight: 900; letter-spacing: -0.035em;
      text-transform: uppercase;
      margin-top: clamp(4px, 1vh, 14px);
      background: linear-gradient(180deg, #ffffff 30%, #cfe9ff 72%, var(--accent) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 60px rgba(65,183,255,0.35));
      animation: rise 1.1s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .divider {
      position: relative; width: min(520px, 60vw); height: 1px;
      margin: clamp(20px, 3.4vh, 38px) auto clamp(16px, 2.6vh, 28px);
      background: linear-gradient(90deg, transparent, rgba(143,210,255,0.55), transparent);
      animation: grow 1.2s 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    .divider::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 8px; height: 8px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #fff; box-shadow: 0 0 14px 4px rgba(65,183,255,0.8);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes grow { from { opacity: 0; transform: scaleX(0.2); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .subtitle {
      font-size: clamp(22px, 2.6vw, 46px);
      font-weight: 300; font-style: italic;
      color: #e6ecf5; letter-spacing: 0.01em;
      margin: 0;
      animation: rise 1s 0.85s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ---------- Loghi partner ---------- */
    .partners {
      position: absolute; left: 0; right: 0; bottom: clamp(54px, 8vh, 90px);
      z-index: 3;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(26px, 3.6vw, 64px);
      animation: rise 1s 1.1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .partners img { display: block; width: auto; }
    .partners .fds  { height: clamp(56px, 8.2vh, 96px); }
    .partners .dima { height: clamp(34px, 5vh, 58px); filter: brightness(0) invert(1); }   /* logo tutto bianco */
    .partners .sep {
      width: 1px; height: clamp(48px, 7vh, 80px);
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.35), transparent);
    }

    @media (max-aspect-ratio: 1/1) {
      .title .l1 { letter-spacing: 0.18em; margin-right: -0.18em; font-size: 7vw; }
      .title .l2 { font-size: 17vw; }
      .partners { flex-direction: column; gap: 18px; }
      .partners .sep { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); }
    }
  </style>
</head>
<body>

  <div class="stage">
    <canvas id="sky"></canvas>
    <div class="scrim"></div>
    <div class="vignette"></div>

    <div class="content">
      <h1 class="title">
        <span class="l1">Saturday Night</span>
        <span class="l2">Science</span>
      </h1>
      <div class="divider"></div>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <div class="partners">
      <img class="fds" src="img/loghi/festival-scienza-negativo.png" alt="Festival della Scienza" />
      <span class="sep"></span>
      <img class="dima" src="img/loghi/dima-negativo.png" alt="Università di Genova — DIMA Dipartimento di Matematica" />
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="#">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="index.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    const TXT = {
      it: { subtitle: 'Macchine che pensano da sole' },
      en: { subtitle: 'Machines that think for themselves' }
    };
    function renderTexts() {
      const t = TXT[lang];
      document.getElementById('subtitle').textContent = t.subtitle;
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();

    // ── Rete neurale a strati: segnali che entrano da sinistra, accendono i
    //    neuroni e si propagano strato dopo strato verso destra ──
    (function net() {
      const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const COUNTS = [5, 8, 11, 13, 11, 8, 5];          // neuroni per strato
      let W, H, layers = [], edges = [], pulses = [], lastWave = -1e9;

      function init() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const x0 = W * 0.05, x1 = W * 0.95, top = H * 0.08, bot = H * 0.92;
        layers = COUNTS.map((n, li) => {
          const x = x0 + (x1 - x0) * li / (COUNTS.length - 1);
          const span = (bot - top) * (0.45 + 0.55 * n / Math.max(...COUNTS));
          return Array.from({ length: n }, (_, k) => ({
            x: x + (Math.random() - 0.5) * W * 0.02,
            y: H / 2 - span / 2 + span * (n === 1 ? 0.5 : k / (n - 1)),
            ph: Math.random() * 6.283, act: 0, li
          }));
        });
        edges = [];
        for (let li = 0; li < layers.length - 1; li++)
          for (const a of layers[li]) for (const b of layers[li + 1])
            edges.push({ a, b, w: Math.random() });
        pulses = [];
      }

      function fire(from, t) {
        const next = layers[from.li + 1];
        if (!next) return;
        const k = 1 + (Math.random() * 2.4 | 0);          // ogni neurone ne eccita 1–3
        for (let i = 0; i < k; i++) pulses.push({ a: from, b: next[Math.random() * next.length | 0], p: 0, v: 0.018 + Math.random() * 0.008 });
      }

      function pos(n, t) { return [n.x, n.y + Math.sin(t * 0.0005 + n.ph) * 5]; }

      function frame(t) {
        ctx.clearRect(0, 0, W, H);
        // un'onda di ingresso ogni ~0,8 s
        if (t - lastWave > 800 && pulses.length < 160) {
          lastWave = t;
          const inp = layers[0];
          for (let i = 0; i < 2; i++) { const n = inp[Math.random() * inp.length | 0]; n.act = 1; fire(n, t); }
        }
        // collegamenti: tenui, più chiari dove passa un segnale
        ctx.lineWidth = 1;
        for (const e of edges) {
          const [ax, ay] = pos(e.a, t), [bx, by] = pos(e.b, t);
          const glow = Math.max(e.a.act, e.b.act) * 0.18;
          ctx.strokeStyle = `rgba(65,183,255,${0.06 + e.w * 0.08 + glow})`;
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        }
        // segnali in viaggio
        for (const pl of pulses) {
          pl.p += pl.v;
          const [ax, ay] = pos(pl.a, t), [bx, by] = pos(pl.b, t);
          const x = ax + (bx - ax) * pl.p, y = ay + (by - ay) * pl.p;
          ctx.strokeStyle = 'rgba(143,210,255,0.55)'; ctx.lineWidth = 1.6;
          const q = Math.max(0, pl.p - 0.12);
          ctx.beginPath(); ctx.moveTo(ax + (bx - ax) * q, ay + (by - ay) * q); ctx.lineTo(x, y); ctx.stroke();
          const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
          g.addColorStop(0, 'rgba(143,210,255,0.95)'); g.addColorStop(1, 'rgba(65,183,255,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
          if (pl.p >= 1) { pl.b.act = 1; if (Math.random() < 0.8) fire(pl.b, t); }
        }
        pulses = pulses.filter(pl => pl.p < 1);
        // neuroni: si accendono quando arriva un segnale e si spengono piano
        for (const L of layers) for (const n of L) {
          const [x, y] = pos(n, t);
          if (n.act > 0.02) {
            const r = 6 + n.act * 16;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, `rgba(65,183,255,${0.55 * n.act})`); g.addColorStop(1, 'rgba(65,183,255,0)');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
          }
          ctx.fillStyle = '#02040b'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill();
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = `rgba(143,210,255,${0.6 + n.act * 0.4})`;
          ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.stroke();
          if (n.act > 0.05) { ctx.fillStyle = `rgba(255,255,255,${n.act})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.283); ctx.fill(); }
          n.act *= 0.965;
        }
        if (!still) requestAnimationFrame(frame);
      }

      init();
      window.addEventListener('resize', init);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
