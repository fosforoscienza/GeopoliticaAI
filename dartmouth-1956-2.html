<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La nascita dell'AI — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0;
      background:
        radial-gradient(60% 80% at 50% 0%, rgba(65,183,255,0.15), transparent 60%),
        radial-gradient(40% 50% at 50% 100%, rgba(65,183,255,0.09), transparent 70%),
        #02040b;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(28px, 5vh, 60px) clamp(36px, 6vw, 100px);
      box-sizing: border-box;
    }

    /* ---------- Intestazione ---------- */
    .head {
      text-align: center; margin-bottom: clamp(22px, 3.4vh, 44px);
      animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes rise { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .eyebrow {
      font-size: clamp(14px, 1.2vw, 19px);
      font-weight: 700; letter-spacing: 0.34em;
      text-transform: uppercase; color: var(--accent-soft);
      margin-bottom: clamp(12px, 1.8vh, 20px);
    }
    .name {
      font-size: clamp(60px, 8.32vw, 139px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.9;
      margin: 0; text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 28%, #8fd2ff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      text-shadow: 0 0 80px rgba(65,183,255,0.35);
    }
    .lead {
      font-size: clamp(22px, 2.3vw, 40px);
      line-height: 1.4; color: #e2e8f0; font-weight: 300;
      max-width: 1300px; margin: clamp(20px,3vh,34px) auto 0;
    }
    .lead b { color: #fff; font-weight: 600; }
    .lead .accent { color: var(--accent-soft); font-weight: 600; font-style: italic; }

    /* ---------- Tre blocchi ---------- */
    .cols {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: clamp(22px, 3.2vw, 64px);
      max-width: 1416px; width: 100%;
      margin-bottom: clamp(22px, 3.4vh, 44px);
    }
    .cols { margin-top: clamp(16px, 4vh, 50px); }
    .col {
      text-align: center;
      animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    .col:nth-child(1){ animation-delay: .2s }
    .col:nth-child(2){ animation-delay: .35s }
    .col:nth-child(3){ animation-delay: .5s }
    .col .num {
      display: block; font-size: clamp(90px, 9.5vw, 180px); font-weight: 900; line-height: 0.9; letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 30%, #8fd2ff 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 40px rgba(65,183,255,0.3));
    }
    .col h3 {
      margin: clamp(8px, 1.4vh, 16px) 0 0; font-size: clamp(22px, 2.1vw, 40px); font-weight: 300; color: #e2e8f0;
    }
    .col h3 b { color: #fff; font-weight: 700; }

    @media (max-aspect-ratio: 1/1) {
      .stage { justify-content: flex-start; overflow-y: auto; padding-top: clamp(40px,7vh,70px); padding-bottom: clamp(90px,13vh,120px); }
      .cols { grid-template-columns: 1fr; gap: clamp(18px,2.6vh,28px); max-width: 732px; }
      .col { padding-top: clamp(34px,5vh,48px); }
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="name" id="name"></h1>
      <p class="lead" id="lead"></p>
    </div>

    <div class="cols">
      <div class="col"><span class="num">4</span><h3 id="h1"></h3></div>
      <div class="col"><span class="num">8</span><h3 id="h2"></h3></div>
      <div class="col"><span class="num">1</span><h3 id="h3"></h3></div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="dartmouth-1956.html">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="timeline.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    const TXT = {
      it: {
        eyebrow: 'Dartmouth College · Estate 1956',
        name: 'La nascita dell\'AI',
        lead: '<span class="accent">«Ogni aspetto dell\'apprendimento e dell\'intelligenza può essere descritto così precisamente che una macchina potrà simularlo»</span>',
        h1: '<b>scienziati</b> firmano la proposta', h2: '<b>settimane</b> di lavoro', h3: '<b>parola nuova</b>: «Artificial Intelligence»'
      },
      en: {
        eyebrow: 'Dartmouth College · Summer 1956',
        name: 'The birth of AI',
        lead: '<span class="accent">“Every aspect of learning or any other feature of intelligence can be so precisely described that a machine can be made to simulate it”</span>',
        h1: '<b>scientists</b> sign the proposal', h2: '<b>weeks</b> of work', h3: '<b>new phrase</b>: “Artificial Intelligence”'
      }
    };

    function set(id, html){ document.getElementById(id).innerHTML = html; }
    function renderTexts() {
      const t = TXT[lang];
      ['eyebrow','name','lead','h1','h2','h3'].forEach(k => set(k, t[k]));
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();
  </script>
</body>
</html>
