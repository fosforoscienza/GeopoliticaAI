<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dartmouth 1956 — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #f59e0b; --accent-soft: #fbbf24; }
    html, body { background: #07050a !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0;
      background:
        radial-gradient(70% 60% at 50% 42%, rgba(245,158,11,0.13), transparent 70%),
        #07050a;
      overflow: hidden;
    }

    /* ---------- Carta millimetrata da laboratorio anni '50 ---------- */
    .grid {
      position: absolute; inset: 0; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(251,191,36,0.05) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(90deg, rgba(251,191,36,0.05) 0 1px, transparent 1px 48px);
      -webkit-mask: radial-gradient(60% 60% at 50% 42%, #000 20%, transparent 75%);
              mask: radial-gradient(60% 60% at 50% 42%, #000 20%, transparent 75%);
    }

    /* ---------- «1956» gigante in filigrana ---------- */
    .year {
      position: absolute; left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      font-size: clamp(220px, 34vw, 620px);
      font-weight: 900; letter-spacing: -0.05em; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(245,158,11,0.22);
      white-space: nowrap; pointer-events: none; user-select: none;
      animation: year-in 1.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes year-in {
      from { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* ---------- Intestazione dattiloscritta della proposta ---------- */
    .typed-wrap {
      position: absolute; top: clamp(26px, 5.5vh, 60px); left: 0; right: 0;
      text-align: center; z-index: 3;
    }
    .typed {
      display: inline-block; overflow: hidden; white-space: nowrap;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(11px, 0.95vw, 16px);
      letter-spacing: 0.04em; color: rgba(253,230,138,0.62);
      border-right: 2px solid var(--accent-soft);
      width: 0;
      animation:
        typing 2.6s 0.5s steps(79, end) forwards,
        caret 0.8s step-end infinite;
    }
    .typed b { color: #fde68a; font-weight: 700; }
    @keyframes typing { to { width: calc(79ch + 3.2em); } }
    @keyframes caret { 50% { border-color: transparent; } }
    .typed-date {
      display: block; margin-top: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(10px, 0.8vw, 13px); letter-spacing: 0.2em;
      color: rgba(253,230,138,0.38);
      animation: fade 0.8s 3.1s both;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Costellazione dei dieci partecipanti ---------- */
    .net {
      position: absolute; left: 0; right: 0;
      top: clamp(80px, 13vh, 140px); height: 54vh;
      width: 100%; z-index: 2; overflow: visible;
      animation: drift 22s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-1.2%) scale(1.025); }
    }
    .net .edge {
      fill: none; stroke: rgba(251,191,36,0.32); stroke-width: 1.4;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: draw 1.4s cubic-bezier(0.65,0,0.35,1) forwards;
    }
    .net .edge.core { stroke: rgba(251,191,36,0.75); stroke-width: 2; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .net .node { opacity: 0; animation: pop 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .net .dot  { fill: #fbbf24; }
    .net .node.core .dot { fill: #fff7e0; }
    .net .halo { fill: rgba(245,158,11,0.28); animation: halo 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.25); } }
    .net text {
      font-family: inherit; font-size: 22px; font-weight: 600;
      fill: #e7dcc4; text-anchor: middle; letter-spacing: 0.02em;
    }
    .net .node.core text { fill: #fff; font-weight: 800; font-size: 25px; }
    .net .node.core .role {
      font-size: 15px; font-weight: 700; letter-spacing: 0.22em;
      fill: rgba(251,191,36,0.8); text-transform: uppercase; font-weight: 700;
    }

    /* sfumatura inferiore per far respirare il titolo */
    .fade-bottom {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: linear-gradient(to top, #07050a 0%, rgba(7,5,10,0.94) 14%, rgba(7,5,10,0.5) 28%, rgba(7,5,10,0) 42%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      box-shadow: inset 0 0 240px 60px rgba(0,0,0,0.7);
    }

    /* ---------- Titolo in basso ---------- */
    .title-bar {
      position: absolute; left: 0; right: 0; bottom: clamp(36px, 7vh, 74px);
      text-align: center; z-index: 3;
      animation: rise 1s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      font-size: clamp(12px, 1vw, 16px);
      font-weight: 700; letter-spacing: 0.34em;
      text-transform: uppercase; color: var(--accent-soft);
      margin-bottom: clamp(10px, 1.6vh, 18px);
    }
    .name {
      font-size: clamp(58px, 8vw, 132px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.9;
      margin: 0; text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 28%, #fcd34d 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      text-shadow: 0 0 70px rgba(245,158,11,0.4);
    }
    .subtitle {
      font-size: clamp(15px, 1.6vw, 26px);
      color: #d6cfc2; font-weight: 300; font-style: italic;
      margin-top: clamp(10px, 1.6vh, 18px);
      letter-spacing: 0.01em;
    }

    @media (max-aspect-ratio: 1/1) {
      .typed-wrap { top: 84px; padding: 0 16px; }
      .typed { white-space: normal; width: auto; max-width: 88vw; border-right: 0; animation: fade 0.8s 0.4s both; }
      .typed-date { animation-delay: 0.8s; }
      .net { top: clamp(110px, 16vh, 170px); height: 40vh; }
      .year { top: 36%; font-size: 46vw; }
      .title-bar { bottom: clamp(40px, 9vh, 90px); padding: 0 16px; }
      .name { font-size: min(15vw, 132px); }
    }
  </style>
</head>
<body>

  <div class="stage">

    <div class="year">1956</div>

    <div class="typed-wrap">
      <span class="typed">A PROPOSAL FOR THE DARTMOUTH SUMMER RESEARCH PROJECT ON <b>ARTIFICIAL INTELLIGENCE</b></span>
      <span class="typed-date">J. McCARTHY · M. L. MINSKY · N. ROCHESTER · C. E. SHANNON — AUGUST 31, 1955</span>
    </div>

    <!-- I dieci partecipanti «storici»: i quattro promotori al centro, in luce piena -->

        <path class="edge core" pathLength="1" d="M1060 155 L1020 390" style="animation-delay:1.2s"/>
        <path class="edge core" pathLength="1" d="M545 160 L1060 155" style="animation-delay:1.3s"/>
        <path class="edge" pathLength="1" d="M800 250 L590 400" style="animation-delay:1.4s"/>

        <path class="edge" pathLength="1" d="M545 160 L590 400" style="animation-delay:1.55s"/>
        <path class="edge" pathLength="1" d="M300 270 L330 500" style="animation-delay:1.6s"/>
        <path class="edge" pathLength="1" d="M590 400 L330 500" style="animation-delay:1.65s"/>

      </g>

      <g class="node core" style="animation-delay:.5s"><circle class="halo" cx="800" cy="250" r="26"/><circle class="dot" cx="800" cy="250" r="9"/><text x="800" y="296">John McCarthy</text><text class="role" x="800" y="324">Dartmouth</text></g>
      <g class="node core" style="animation-delay:.6s"><circle class="halo" cx="545" cy="160" r="24" style="animation-delay:.6s"/><circle class="dot" cx="545" cy="160" r="8"/><text x="545" y="204">Marvin Minsky</text><text class="role" x="545" y="232">Harvard</text></g>
      <g class="node core" style="animation-delay:.7s"><circle class="halo" cx="1060" cy="155" r="24" style="animation-delay:1.2s"/><circle class="dot" cx="1060" cy="155" r="8"/><text x="1060" y="199">Claude Shannon</text><text class="role" x="1060" y="227">Bell Labs</text></g>
      <g class="node core" style="animation-delay:.8s"><circle class="halo" cx="1020" cy="390" r="24" style="animation-delay:1.8s"/><circle class="dot" cx="1020" cy="390" r="8"/><text x="1020" y="434">Nathaniel Rochester</text><text class="role" x="1020" y="462">IBM</text></g>

      <g class="node" style="animation-delay:1.5s"><circle class="dot" cx="300" cy="270" r="6"/><text x="300" y="308">Ray Solomonoff</text></g>
      <g class="node" style="animation-delay:1.6s"><circle class="dot" cx="590" cy="400" r="6"/><text x="590" y="438">Oliver Selfridge</text></g>
      <g class="node" style="animation-delay:1.7s"><circle class="dot" cx="330" cy="500" r="6"/><text x="330" y="538">Trenchard More</text></g>
      <g class="node" style="animation-delay:1.8s"><circle class="dot" cx="1300" cy="270" r="6"/><text x="1300" y="308">Arthur Samuel</text></g>
      <g class="node" style="animation-delay:1.9s"><circle class="dot" cx="1210" cy="520" r="6"/><text x="1210" y="558">Allen Newell</text></g>
      <g class="node" style="animation-delay:2.0s"><circle class="dot" cx="1420" cy="450" r="6"/><text x="1420" y="488">Herbert Simon</text></g>
    </svg>

    <div class="fade-bottom"></div>
    <div class="vignette"></div>

    <div class="title-bar">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="name" id="name"></h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="pechino-3.html">&#8592;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>

  <script src="js/common.js"></script>
  <script>
    const TXT = {
      it: {
        eyebrow: 'Hanover, New Hampshire · Estate 1956',
        name: 'Dartmouth',
        subtitle: 'L’estate in cui nacque l’Intelligenza Artificiale'
      },
      en: {
        eyebrow: 'Hanover, New Hampshire · Summer 1956',
        name: 'Dartmouth',
        subtitle: 'The summer Artificial Intelligence was born'
      }
    };
    function renderTexts() {
      const t = TXT[lang];
      document.getElementById('eyebrow').textContent  = t.eyebrow;
      document.getElementById('name').textContent     = t.name;
      document.getElementById('subtitle').textContent = t.subtitle;
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();
  </script>
</body>
</html>
