<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dartmouth 1956 — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #f59e0b; --accent-soft: #fbbf24; }
    html, body { background: #07050a !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0;
      background:
        radial-gradient(70% 60% at 50% 42%, rgba(245,158,11,0.13), transparent 70%),
        #07050a;
      overflow: hidden;
    }

    /* ---------- Carta millimetrata da laboratorio anni '50 ---------- */
    .grid {
      position: absolute; inset: 0; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(251,191,36,0.05) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(90deg, rgba(251,191,36,0.05) 0 1px, transparent 1px 48px);
      -webkit-mask: radial-gradient(60% 60% at 50% 42%, #000 20%, transparent 75%);
              mask: radial-gradient(60% 60% at 50% 42%, #000 20%, transparent 75%);
    }

    /* ---------- «1956» gigante in filigrana ---------- */
    .year {
      position: absolute; left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      font-size: clamp(220px, 34vw, 620px);
      font-weight: 900; letter-spacing: -0.05em; line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(245,158,11,0.22);
      white-space: nowrap; pointer-events: none; user-select: none;
      animation: year-in 1.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes year-in {
      from { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* ---------- Intestazione dattiloscritta della proposta ---------- */
    .typed-wrap {
      position: absolute; top: clamp(26px, 5.5vh, 60px); left: 0; right: 0;
      text-align: center; z-index: 3;
    }
    .typed {
      display: inline-block; overflow: hidden; white-space: nowrap;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(11px, 0.95vw, 16px);
      letter-spacing: 0.04em; color: rgba(253,230,138,0.62);
      border-right: 2px solid var(--accent-soft);
      width: 0;
      animation:
        typing 2.6s 0.5s steps(79, end) forwards,
        caret 0.8s step-end infinite;
    }
    .typed b { color: #fde68a; font-weight: 700; }
    @keyframes typing { to { width: calc(79ch + 3.2em); } }
    @keyframes caret { 50% { border-color: transparent; } }
    .typed-date {
      display: block; margin-top: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(10px, 0.8vw, 13px); letter-spacing: 0.2em;
      color: rgba(253,230,138,0.38);
      animation: fade 0.8s 3.1s both;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- La foto dei pionieri, con i nomi ai lati ---------- */
    .pionieri {
      position: absolute; left: 0; right: 0;
      top: clamp(80px, 13vh, 140px); height: 56vh;
      width: 100%; z-index: 3; overflow: visible;
    }
    .pionieri .photo {
      animation: photo-in 1.4s .2s cubic-bezier(0.16,1,0.3,1) both;
      transform-box: fill-box; transform-origin: center;
    }
    @keyframes photo-in {
      from { opacity: 0; transform: scale(1.04); }
      to   { opacity: 1; transform: scale(1); }
    }
    .pionieri image { filter: sepia(0.38) contrast(1.06) brightness(0.92); }
    .pionieri .frame { fill: none; stroke: rgba(251,191,36,0.35); stroke-width: 2; }

    .pionieri .edge {
      fill: none; stroke: rgba(251,191,36,0.7); stroke-width: 2;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: draw 1s cubic-bezier(0.65,0,0.35,1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pionieri .pin { fill: #fff7e0; stroke: #f59e0b; stroke-width: 3; opacity: 0; animation: fade .4s forwards; }

    .pionieri .node { opacity: 0; animation: pop 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pionieri text { font-family: inherit; font-size: 32px; font-weight: 600; fill: #ece3cf; letter-spacing: 0.01em; }
    .pionieri .node.core text { fill: #fde68a; font-weight: 800; font-size: 35px; }
    .pionieri .role {
      font-size: 16px !important; font-weight: 700 !important; letter-spacing: 0.22em;
      fill: rgba(251,191,36,0.75) !important; text-transform: uppercase;
    }
    .pionieri .left text  { text-anchor: end; }
    .pionieri .right text { text-anchor: start; }
    .pionieri .caption {
      font-size: 15px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;
      fill: rgba(253,230,138,0.55); text-anchor: middle;
      opacity: 0; animation: fade .8s 3.2s forwards;
    }

    /* sfumatura inferiore per far respirare il titolo */
    .fade-bottom {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: linear-gradient(to top, #07050a 0%, rgba(7,5,10,0.94) 14%, rgba(7,5,10,0.5) 28%, rgba(7,5,10,0) 42%);
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      box-shadow: inset 0 0 240px 60px rgba(0,0,0,0.7);
    }

    /* ---------- Titolo in basso ---------- */
    .title-bar {
      position: absolute; left: 0; right: 0; bottom: clamp(36px, 7vh, 74px);
      text-align: center; z-index: 3;
      animation: rise 1s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      font-size: clamp(12px, 1vw, 16px);
      font-weight: 700; letter-spacing: 0.34em;
      text-transform: uppercase; color: var(--accent-soft);
      margin-bottom: clamp(10px, 1.6vh, 18px);
    }
    .name {
      font-size: clamp(58px, 8vw, 132px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.9;
      margin: 0; text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 28%, #fcd34d 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      text-shadow: 0 0 70px rgba(245,158,11,0.4);
    }
    .subtitle {
      font-size: clamp(15px, 1.6vw, 26px);
      color: #d6cfc2; font-weight: 300; font-style: italic;
      margin-top: clamp(10px, 1.6vh, 18px);
      letter-spacing: 0.01em;
    }

    @media (max-aspect-ratio: 1/1) {
      .typed-wrap { top: 84px; padding: 0 16px; }
      .typed { white-space: normal; width: auto; max-width: 88vw; border-right: 0; animation: fade 0.8s 0.4s both; }
      .typed-date { animation-delay: 0.8s; }
      .pionieri { top: clamp(110px, 16vh, 170px); height: 40vh; }
      .year { top: 36%; font-size: 46vw; }
      .title-bar { bottom: clamp(40px, 9vh, 90px); padding: 0 16px; }
      .name { font-size: min(15vw, 132px); }
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="grid"></div>
    <div class="year">1956</div>

    <div class="typed-wrap">
      <span class="typed">A PROPOSAL FOR THE DARTMOUTH SUMMER RESEARCH PROJECT ON <b>ARTIFICIAL INTELLIGENCE</b></span>
      <span class="typed-date">J. McCARTHY · M. L. MINSKY · N. ROCHESTER · C. E. SHANNON — AUGUST 31, 1955</span>
    </div>

    <!-- I pionieri sul prato davanti alla Dartmouth Hall, estate 1956.
         Identificazione secondo IEEE Spectrum (G. Solomonoff): dietro Selfridge, Rochester,
         Minsky, McCarthy; davanti Solomonoff, Peter Milner, Shannon.
         In oro i quattro firmatari della proposta. -->
    <svg class="pionieri" viewBox="0 0 2200 790" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="I pionieri dell'intelligenza artificiale a Dartmouth nel 1956">
      <defs>
        <clipPath id="clip-foto"><rect x="426" y="0" width="1348" height="760" rx="16"/></clipPath>
        <linearGradient id="g-sfuma" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.74" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
        </linearGradient>
        <mask id="m-sfuma"><rect x="426" y="0" width="1348" height="760" fill="url(#g-sfuma)"/></mask>
      </defs>

      <g class="photo">
        <g clip-path="url(#clip-foto)" mask="url(#m-sfuma)">
          <svg x="426" y="0" width="1348" height="760" viewBox="60 190 940 530" preserveAspectRatio="xMidYMid slice">
            <image href="img/dartmouth-1956-pionieri.jpg" x="0" y="0" width="1200" height="833"/>
          </svg>
        </g>
        <rect class="frame" x="426" y="0" width="1348" height="760" rx="16"/>
      </g>

      <!-- linee dal nome al volto: a gomito per la fila dietro, dirette per quella davanti -->
      <g class="edges">
        <path class="edge" pathLength="1" d="M420 60 H1067 V214"  style="animation-delay:1.2s"/>
        <path class="edge" pathLength="1" d="M420 140 H835 V164"  style="animation-delay:1.35s"/>
        <path class="edge" pathLength="1" d="M420 290 L668 266"    style="animation-delay:1.5s"/>
        <path class="edge" pathLength="1" d="M420 470 L868 350"    style="animation-delay:1.65s"/>
        <path class="edge" pathLength="1" d="M1780 60 H1265 V196"  style="animation-delay:1.8s"/>
        <path class="edge" pathLength="1" d="M1780 300 L1432 330"  style="animation-delay:1.95s"/>
        <path class="edge" pathLength="1" d="M1780 520 L1196 384"  style="animation-delay:2.1s"/>
      </g>
      <g>
        <circle class="pin" cx="1067" cy="214" r="8" style="animation-delay:2.1s"/>
        <circle class="pin" cx="835"  cy="164" r="8" style="animation-delay:2.25s"/>
        <circle class="pin" cx="668"  cy="266" r="8" style="animation-delay:2.4s"/>
        <circle class="pin" cx="868"  cy="350" r="8" style="animation-delay:2.55s"/>
        <circle class="pin" cx="1265" cy="196" r="8" style="animation-delay:2.7s"/>
        <circle class="pin" cx="1432" cy="330" r="8" style="animation-delay:2.85s"/>
        <circle class="pin" cx="1196" cy="384" r="8" style="animation-delay:3.0s"/>
      </g>

      <g class="left">
        <g class="node core" style="animation-delay:1.0s"><text x="400" y="72">Marvin Minsky</text><text class="role" x="400" y="102">Harvard</text></g>
        <g class="node core" style="animation-delay:1.15s"><text x="400" y="152">Nathaniel Rochester</text><text class="role" x="400" y="182">IBM</text></g>
        <g class="node" style="animation-delay:1.3s"><text x="400" y="302">Oliver Selfridge</text><text class="role" x="400" y="332">MIT Lincoln Lab</text></g>
        <g class="node" style="animation-delay:1.45s"><text x="400" y="482">Ray Solomonoff</text><text class="role" x="400" y="512">Technical Research Group</text></g>
      </g>
      <g class="right">
        <g class="node core" style="animation-delay:1.6s"><text x="1800" y="72">John McCarthy</text><text class="role" x="1800" y="102">Dartmouth</text></g>
        <g class="node core" style="animation-delay:1.75s"><text x="1800" y="312">Claude Shannon</text><text class="role" x="1800" y="342">Bell Labs</text></g>
        <g class="node" style="animation-delay:1.9s"><text x="1800" y="532">Peter Milner</text><text class="role" x="1800" y="562">McGill</text></g>
      </g>

      <text class="caption" id="caption" x="1100" y="786"></text>
    </svg>

    <div class="fade-bottom"></div>
    <div class="vignette"></div>

    <div class="title-bar">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="name" id="name"></h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>

  <div id="nav-dots"></div>
  <a class="nav-arrow" id="nav-prev" href="pechino-3.html">&#8592;</a>
  <a class="nav-arrow" id="nav-next" href="dartmouth-1956-2.html">&#8594;</a>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script>
    const TXT = {
      it: {
        eyebrow: 'Hanover, New Hampshire · Estate 1956',
        name: 'Dartmouth',
        subtitle: 'L’estate in cui nacque l’Intelligenza Artificiale',
        caption: 'Davanti alla Dartmouth Hall · in oro i firmatari della proposta'
      },
      en: {
        eyebrow: 'Hanover, New Hampshire · Summer 1956',
        name: 'Dartmouth',
        subtitle: 'The summer Artificial Intelligence was born'
      }
    };
    function renderTexts() {
      const t = TXT[lang];
      document.getElementById('eyebrow').textContent  = t.eyebrow;
      document.getElementById('name').textContent     = t.name;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('caption').textContent  = t.caption;
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    initNav();
  </script>
</body>
</html>
