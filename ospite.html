<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ospite — Geopolitica della AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root { --accent: #41b7ff; --accent-soft: #8fd2ff; --accent-deep: #1f7fd1; }
    html, body { background: #02040b !important; overflow: hidden; height: 100%; margin: 0; }
    body { font-family: inherit; }

    .stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(80% 55% at 50% 110%, rgba(31,127,209,0.20), transparent 70%),
        radial-gradient(60% 50% at 50% -10%, rgba(65,183,255,0.14), transparent 70%),
        #02040b;
    }
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(50% 44% at 50% 50%, rgba(2,4,11,0.86) 0%, rgba(2,4,11,0.5) 55%, rgba(2,4,11,0) 100%);
    }
    .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 260px 80px rgba(0,0,0,0.75); }

    .content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 clamp(16px, 4vw, 60px);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 14px;
      font-size: clamp(13px, 1.1vw, 18px); font-weight: 700; letter-spacing: 0.36em;
      text-transform: uppercase; color: var(--accent-soft);
      margin-bottom: clamp(18px, 3vh, 34px);
      animation: rise 0.9s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .eyebrow::before, .eyebrow::after { content: ''; width: 34px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent)); }
    .eyebrow::after { background: linear-gradient(90deg, var(--accent), transparent); }

    .who { margin: 0; line-height: 0.88; }
    .who .first {
      display: block;
      font-size: clamp(30px, 4.4vw, 80px);
      font-weight: 300; letter-spacing: 0.32em; margin-right: -0.32em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-soft) 0%, var(--accent) 50%, var(--accent-soft) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 22px rgba(65,183,255,0.45));
      animation: rise 1s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }
    .who .last {
      display: block;
      font-size: clamp(70px, 11.5vw, 220px);
      font-weight: 900; letter-spacing: -0.035em;
      text-transform: uppercase;
      margin-top: clamp(4px, 1vh, 14px);
      background: linear-gradient(180deg, #ffffff 30%, #cfe9ff 72%, var(--accent) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 60px rgba(65,183,255,0.35));
      animation: rise 1.1s 0.45s cubic-bezier(0.16,1,0.3,1) both;
    }

    .divider {
      position: relative; width: min(520px, 60vw); height: 1px;
      margin: clamp(22px, 3.6vh, 40px) auto clamp(18px, 2.8vh, 30px);
      background: linear-gradient(90deg, transparent, rgba(143,210,255,0.55), transparent);
      animation: grow 1.2s 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    .divider::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%);
      background: #fff; box-shadow: 0 0 14px 4px rgba(65,183,255,0.8);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes grow { from { opacity: 0; transform: scaleX(0.2); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .dept {
      font-size: clamp(30px, 3.4vw, 60px); font-weight: 800; letter-spacing: 0.12em;
      color: #fff; text-transform: uppercase;
      animation: rise 1s 1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .dept-full {
      margin-top: clamp(6px, 1vh, 12px);
      font-size: clamp(16px, 1.6vw, 28px); font-weight: 300; font-style: italic; color: #e6ecf5;
      animation: rise 1s 1.15s cubic-bezier(0.16,1,0.3,1) both;
    }
    .uni {
      margin-top: clamp(10px, 1.6vh, 18px);
      font-size: clamp(12px, 1vw, 17px); font-weight: 700; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--accent-soft);
      animation: rise 1s 1.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .content *, .content *::after { animation: none !important; }
    }

    @media (max-aspect-ratio: 1/1) {
      .who .first { letter-spacing: 0.18em; margin-right: -0.18em; font-size: 7vw; }
      .who .last { font-size: 15vw; }
    }
  </style>
</head>
<body>

  <div class="stage">
    <canvas id="sky"></canvas>
    <div class="scrim"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="who"><span class="first" id="first"></span><span class="last" id="last"></span></h1>
      <div class="divider"></div>
      <div class="dept" id="dept"></div>
      <div class="dept-full" id="dept-full"></div>
      <div class="uni" id="uni"></div>
    </div>
  </div>

  <div id="lang-toggle">
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/rete-neurale.js"></script>
  <script>
    // Gli intervistati: ospite.html?id=<chiave>
    const DEPTS = {
      dibris: { it: 'Dipartimento di Informatica, Bioingegneria, Robotica e Ingegneria dei Sistemi',
                en: 'Department of Informatics, Bioengineering, Robotics and Systems Engineering' },
      dima:   { it: 'Dipartimento di Matematica', en: 'Department of Mathematics' }
    };
    const GUESTS = {
      rosasco:   { first: 'Lorenzo',  last: 'Rosasco',   dept: 'dibris' },
      villa:     { first: 'Silvia',   last: 'Villa',     dept: 'dima' },
      benvenuto: { first: 'Federico', last: 'Benvenuto', dept: 'dima' }
    };
    const TXT = {
      it: { eyebrow: 'Ne parliamo con', uni: 'Università di Genova' },
      en: { eyebrow: 'In conversation with', uni: 'University of Genoa' }
    };
    const g = GUESTS[new URLSearchParams(location.search).get('id')] || GUESTS.rosasco;
    document.title = g.first + ' ' + g.last + ' — Geopolitica della AI';

    function renderTexts() {
      const t = TXT[lang];
      document.getElementById('eyebrow').textContent   = t.eyebrow;
      document.getElementById('first').textContent     = g.first;
      document.getElementById('last').textContent      = g.last;
      document.getElementById('dept').textContent      = g.dept.toUpperCase();
      document.getElementById('dept-full').textContent = DEPTS[g.dept][lang];
      document.getElementById('uni').textContent       = t.uni;
    }
    function onLangChange() { renderTexts(); }

    initLangToggle();
    renderTexts();
    startNeuralNet(document.getElementById('sky'));
  </script>
</body>
</html>
